name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_INSTALL_FLAGS: --with-deps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: script/bootstrap
      - run: script/test
