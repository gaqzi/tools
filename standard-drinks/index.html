<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standard Drinks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f0eb;
    --card: #fffdf9;
    --text: #2c2418;
    --muted: #8a7e6b;
    --accent: #5a7247;
    --hot: #c4522a;
    --border: #e2ddd5;
    --shadow: 0 2px 20px rgba(44, 36, 24, 0.06);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .container { width: 100%; max-width: 440px; }

  standard-drinks, liquids-view, drinks-view, drink-lists-view, catalogue-settings, catalogue-file { display: block; }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.75rem;
    font-weight: 400;
    text-align: center;
    margin-bottom: 1.5rem;
  }

  h2 { font-family: 'DM Serif Display', serif; font-size: 1.25rem; font-weight: 400; margin: 1.5rem 0 0.75rem; }

  liquids-view, drinks-view, drink-lists-view {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 1.25rem;
  }

  table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
  td { padding: 0.35rem 0; border-bottom: 1px solid var(--border); }
  td.alcohol-percent { text-align: right; color: var(--muted); }
  td.actions { text-align: right; width: 1%; padding-left: 0.5rem; }
  button.remove { font-size: 0.75rem; color: var(--muted); background: none; border: 1px solid var(--border); border-radius: 6px; padding: 0.15rem 0.4rem; cursor: pointer; }
  form.add-liquid, form.add-drink, form.add-part, form.add-drink-list, form.add-entry { display: flex; gap: 0.5rem; }
  form input, form select { min-width: 0; flex: 1; padding: 0.4rem; border: 1px solid var(--border); border-radius: 8px; }

  /* A drink row is a card: name and figures on one line, parts and the add-part form below. */
  drinks-view tr { display: flex; flex-wrap: wrap; column-gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  drinks-view td { border: 0; padding: 0.1rem 0; }
  drinks-view td.name { flex: 1 0 100%; font-weight: 600; }
  drinks-view td.parts { flex: 1 0 100%; color: var(--muted); font-size: 0.9rem; }
  drinks-view td.standard-drinks::after { content: " std"; color: var(--muted); }
  drinks-view td.add-part-cell { flex: 1 0 100%; margin-top: 0.25rem; }
  /* A drink list row is a card like a drink row. */
  drink-lists-view tr { display: flex; flex-wrap: wrap; column-gap: 0.75rem; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
  drink-lists-view td { border: 0; padding: 0.1rem 0; }
  drink-lists-view td.name { flex: 1 0 100%; font-weight: 600; }
  drink-lists-view td.entries { flex: 1 0 100%; color: var(--muted); font-size: 0.9rem; }
  drink-lists-view td.standard-drinks::after { content: " std"; color: var(--muted); }
  drink-lists-view td.add-entry-cell { flex: 1 0 100%; margin-top: 0.25rem; }
  drink-lists-view p.note { color: var(--muted); font-size: 0.8rem; }
  catalogue-settings, catalogue-file {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 1.25rem;
  }
  catalogue-settings { margin-bottom: 1rem; }
  catalogue-settings p.note { color: var(--muted); font-size: 0.8rem; margin-top: 0.5rem; }
  catalogue-settings input { width: 6rem; padding: 0.4rem; border: 1px solid var(--border); border-radius: 8px; }
  catalogue-file { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; }
  catalogue-file .error { flex: 1 0 100%; }
  catalogue-file button.export { padding: 0.4rem 0.75rem; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; }
  form.edit-liquid, form.edit-drink, form.edit-drink-list { display: flex; gap: 0.25rem; }
  .part, .entry { display: inline-block; margin-right: 0.5rem; white-space: nowrap; }
  button.remove-part, button.remove-entry { font-size: 0.8rem; line-height: 1; color: var(--muted); background: none; border: 0; padding: 0 0.15rem; cursor: pointer; }
  drinks-view td.edit-cell, drink-lists-view td.edit-cell { flex: 1 0 100%; width: auto; margin-top: 0.25rem; }
  drinks-view td.actions, drink-lists-view td.actions { flex: 1 0 100%; width: auto; padding-left: 0; }
  form.edit-liquid input[name=alcoholPercent] { flex: 0 0 4.5rem; }
  td.edit-cell { width: 55%; }
  .error { color: var(--hot); font-size: 0.85rem; min-height: 1.2em; margin-top: 0.5rem; }
</style>
</head>
<body>
<div class="container">
  <h1>Standard Drinks</h1>
  <standard-drinks>
    <catalogue-settings></catalogue-settings>
    <h2>Liquids</h2>
    <liquids-view></liquids-view>
    <h2>Drinks</h2>
    <drinks-view></drinks-view>
    <h2>Drink lists</h2>
    <drink-lists-view></drink-lists-view>
    <h2>Export and import</h2>
    <catalogue-file></catalogue-file>
  </standard-drinks>
</div>
<script type="module" src="standard-drinks.js"></script>
</body>
</html>
